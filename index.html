<!doctype html>
<html lang="gl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proxectos</title>
  <meta name="description" content="Selector minimalista dos proxectos públicos de A. Morón.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css?v=20260912">
</head>
<body>
  <main class="launcher" aria-label="Proxectos de A. Morón">
    <section class="selector" id="selector" aria-label="Escolle un proxecto">
      <button class="select-button" id="selectButton" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span class="selected" id="selectedText">Cargando…</span>
        <span class="chevron" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 9.5 12 14.5 17 9.5"/></svg>
        </span>
      </button>

      <div class="menu" id="menu" role="listbox" aria-label="Proxectos"></div>
    </section>

    <div class="actions" aria-label="Ligazóns do proxecto seleccionado">
      <a class="action" id="codeLink" href="https://github.com/moronbandin" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 9 5 12l3 3"/>
          <path d="m16 9 3 3-3 3"/>
          <path d="m14 6-4 12"/>
        </svg>
        Código
      </a>

      <a class="action project" id="projectLink" href="#" target="_blank" rel="noopener noreferrer">
        Proxecto
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 17 17 7"/>
          <path d="M9 7h8v8"/>
        </svg>
      </a>
    </div>

    <p class="meta" id="projectMeta" aria-live="polite">Actualizando catálogo…</p>
  </main>

  <script src="app.js?v=20260912"></script>
</body>
</html>
